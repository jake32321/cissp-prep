name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_LEPTOS_VERSION: 0.3.11

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check
      - name: Lint server
        run: cargo clippy --features ssr --all-targets -- -D warnings
      - name: Lint browser
        run: cargo clippy --lib --features hydrate --target wasm32-unknown-unknown -- -D warnings
      - name: Test
        run: cargo test --features ssr

      - name: Install cargo-leptos
        run: |
          curl -sSL "https://github.com/leptos-rs/cargo-leptos/releases/download/v${CARGO_LEPTOS_VERSION}/cargo-leptos-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz --strip-components=1 -C ~/.cargo/bin cargo-leptos-x86_64-unknown-linux-gnu/cargo-leptos
      - name: Build release bundle
        run: cargo leptos build --release
